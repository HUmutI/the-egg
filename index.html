<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Egg Club</title>
<style>
  :root {
    --bg: #fdf6ec;
    --shell: #fff8ef;
    --shell-shadow: #e8d9c3;
    --yolk: #f4b73f;
    --ink: #2b241c;
    --muted: #8a7f6f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1812;
      --shell: #f1e6d3;
      --shell-shadow: #c9b795;
      --yolk: #f4b73f;
      --ink: #f3ece0;
      --muted: #a89d8a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    text-align: center;
    max-width: 420px;
  }
  .egg {
    width: 120px;
    height: 150px;
    margin: 0 auto 28px;
    position: relative;
    animation: bob 3.5s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .egg svg { width: 100%; height: 100%; display: block; }
  h1 {
    font-size: 28px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }
  p {
    font-size: 15px;
    line-height: 1.55;
    color: var(--muted);
    margin: 0;
  }
  .dot {
    display: inline-block;
    opacity: 0;
    animation: blink 1.4s infinite;
  }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 20% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="egg">
      <svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="140" rx="46" ry="8" fill="var(--shell-shadow)" opacity="0.5"></ellipse>
        <path d="M60 4 C94 4 110 62 110 96 C110 126 88 146 60 146 C32 146 10 126 10 96 C10 62 26 4 60 4 Z"
              fill="var(--shell)" stroke="var(--shell-shadow)" stroke-width="2"></path>
        <ellipse cx="42" cy="38" rx="10" ry="14" fill="#ffffff" opacity="0.55"></ellipse>
        <circle cx="60" cy="96" r="18" fill="var(--yolk)" opacity="0.9"></circle>
      </svg>
    </div>
    <h1>The Egg Club</h1>
    <p>Something is hatching<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span><br>Check back soon.</p>
  </div>
</body>
</html>
